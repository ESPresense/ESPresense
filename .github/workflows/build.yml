name: Build & Release
on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  release:
    types: [published]

env:
  IDF_VERSION: v5.4.4

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp32, esp32c3, esp32c3-cdc, esp32c6, esp32c6-cdc, esp32s3, esp32s3-cdc, esp32-verbose, esp32c3-verbose, esp32c6-verbose, esp32s3-verbose, m5stickc, m5stickc-plus, m5atom, macchina-a0]
    steps:
    - uses: actions/checkout@v7

    # VERSION / BRANCH land in the firmware as FW_VERSION / FW_BRANCH (see envs.cmake).
    - name: Set pr env
      run: |
        echo "FW_BRANCH=${GITHUB_HEAD_REF}" >> $GITHUB_ENV
        echo "FW_VERSION=${HEAD_SHA::7}" >> $GITHUB_ENV
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      if: ${{ github.event_name == 'pull_request' }}

    - name: Set branch env
      run: |
        echo "FW_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
        echo "FW_VERSION=${GITHUB_SHA::7}" >> $GITHUB_ENV
      if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}

    - name: Set rel env
      run: echo "FW_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      if: startsWith(github.ref, 'refs/tags/v')

    - name: Build with ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: ${{ env.IDF_VERSION }}
        command: FW_VERSION="${{ env.FW_VERSION }}" FW_BRANCH="${{ env.FW_BRANCH }}" ./build.sh ${{ matrix.env }}

    - name: Check firmware size fits in OTA partition
      run: |
        MAX_SIZE=1966080  # 0x1E0000 = 1920 KB, must match app0/app1 in partitions_singleapp.csv
        FW=build/${{ matrix.env }}/espresense.bin
        SIZE=$(stat -c%s "$FW")
        echo "Firmware size: ${SIZE} bytes ($(( SIZE / 1024 )) KB / $(( MAX_SIZE / 1024 )) KB max)"
        if [ "$SIZE" -gt "$MAX_SIZE" ]; then
          echo "::error::Firmware ${{ matrix.env }} is ${SIZE} bytes, exceeding OTA partition limit of ${MAX_SIZE} bytes (1920 KB)"
          exit 1
        fi

    - name: Rename artifact
      run: cp build/${{ matrix.env }}/espresense.bin ${{ matrix.env }}.bin

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.env }}.bin
        path: ${{ matrix.env }}.bin

  native-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Host unit tests
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: ${{ env.IDF_VERSION }}
        command: ./test/run.sh

  comment-pr-alpha-link:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'pull_request' && needs.build.result == 'success' }}
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Find existing alpha test comment
        id: find-comment
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'https://espresense.com/alpha/?pr='

      - name: Create or update alpha test comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ✅ CI build completed.

            Please test this PR build here:
            https://espresense.com/alpha/?pr=${{ github.event.pull_request.number }}

            If you spot regressions or improvements, reply here with results.

  release:
    runs-on: ubuntu-latest
    needs: build  # This job needs to wait for all matrix builds to complete
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts/
    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        files: artifacts/**/*.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
