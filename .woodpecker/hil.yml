when:
  - event: pull_request
    repo: ESPresense/ESPresense
  - event: push
    branch: main
  - event: cron
    branch: main

# Pin to the docker/Linux agent with the ESP32 hardware. Without this the scheduler
# can hand these steps (image:, privileged, /dev/esp32 mounts) to a local-backend
# Windows agent, where they fail instantly with no useful log.
labels:
  backend: docker
  platform: linux/amd64

variables:
  # One command block for all four devices. Everything device-specific comes from the
  # step's own DEVICE / FIRMWARE_ENV, including the lock file name, so the soak policy
  # below lives in exactly one place instead of four copies drifting apart.
  - &hil_run |
    . $IDF_PATH/export.sh
    git clone -q --depth 1 https://github.com/ESPresense/firmware-tester /tmp/firmware-tester
    # The four device steps run concurrently and the component manager writes
    # managed_components/ into the project dir, so each step builds from its own copy.
    cp -r . /tmp/src && cd /tmp/src
    # Bare $GITHUB_TOKEN, not the braced form: Woodpecker substitutes braced references in
    # the YAML before the container ever sees it, and secrets are not available at that
    # point. Braces fail quietly here — an emptied token still clones the public lib_deps,
    # just anonymously and against the unauthenticated rate limit. Escape as $${...} when
    # the shell genuinely needs braces, as the duration log line below does.
    git config --global url."https://$GITHUB_TOKEN@github.com/".insteadOf "https://github.com/"
    # No apostrophes below, comments included: one contraction closes this string.
    flock -w 18000 /lock/$FIRMWARE_ENV.lock bash -c '
      set -e

      # ble-flood-guard only watches the floods first seconds, but a soak runs for up to 4h:
      # pipeline 1337 lost its flood two hours in and still reported green, which is worse than
      # a red build because it looks like evidence. Assert the heartbeat is fresh around the
      # measurement window itself.
      # No braces: Woodpecker substitutes braced references in the YAML before the container sees it.
      flood_alive() {
        hb_age=$(( $(date +%s) - $(stat -c %Y /flood/ble-flood.alive 2>/dev/null || echo 0) ))
        if [ "$hb_age" -gt 90 ]; then
          echo "ble-flood heartbeat is $${hb_age}s old: the flood is not running, so this soak has no BLE load" >&2
          exit 1
        fi
        echo "ble-flood alive (heartbeat $${hb_age}s old)"
      }

      # Opt up to the full soak with a soak/* branch or [soak] in the message. On a
      # pull_request that message is the PR title, not the head commit subject.
      #
      # Keep wait + build + soak under the 600m repo timeout, or the pipeline is
      # cancelled with no useful log.
      SOAK_SECS=14400
      case "$CI_PIPELINE_EVENT" in
        cron) DURATION_SECS=$SOAK_SECS ;;
        push) DURATION_SECS=3600 ;;
        *)    DURATION_SECS=180 ;;
      esac
      case "$CI_COMMIT_SOURCE_BRANCH" in soak/*) DURATION_SECS=$SOAK_SECS ;; esac
      case "$CI_COMMIT_MESSAGE" in *"[soak]"*) DURATION_SECS=$SOAK_SECS ;; esac
      # $${...} escapes the brace form past Woodpecker so the shell expands it after the
      # assignments above. Braces are needed to keep the "s" out of the variable name.
      echo "HIL $FIRMWARE_ENV: $${DURATION_SECS}s (event=$CI_PIPELINE_EVENT branch=$CI_COMMIT_SOURCE_BRANCH)"

      ./build.sh $FIRMWARE_ENV -p $DEVICE -b 115200 erase-flash flash
      python3 /tmp/firmware-tester/scripts/improv_wifi.py --port $DEVICE --ssid "$WIFI_SSID" --password "$WIFI_PASSWORD"
      flood_alive
      # The monitor needs every serial line, the CI log does not: 80 New/Del lines a second
      # for 4h stalled the Woodpecker agent (docker API timeouts, exit 126) on pipeline 1280.
      set -o pipefail
      python3 /tmp/firmware-tester/scripts/hil_monitor.py --port $DEVICE --duration $DURATION_SECS \
        | grep --line-buffered -vE "^[0-9]+ (New|Del) "
      flood_alive
    '

steps:
  # Detached steps are never gated and Woodpecker never captures their stdout, so a bind
  # failure here has been invisible: the step shows "success" for merely starting the
  # container, whether ble_flood.py went on to claim hci0 or die on EBUSY (ESPA-217). The
  # heartbeat + log go on a shared volume so the non-detached guard step below can both
  # verify the flood is live and surface its own diagnostic text in the captured CI log.
  - name: ble-flood
    image: ghcr.io/espresense/ble-loadgen:1
    pull: true
    detach: true
    privileged: true
    network_mode: host
    depends_on: []
    volumes:
      - flood_state:/flood
    environment:
      BLE_FLOOD_HEARTBEAT: /flood/ble-flood.alive
    commands:
      - python3 /app/ble_flood.py --index 0 --rate 40 2>&1 | tee /flood/ble-flood.log

  # Non-detached, so its exit code counts: fails the pipeline (without blocking the
  # test-esp32* steps, which have no depends_on) if the flood never came up live. On
  # failure it prints ble_flood.py's own diagnosis (bluetoothd, a leaked prior flood,
  # missing CAP_NET_ADMIN, ...) into this step's log — the first time that text has
  # been visible anywhere but the bench's own terminal.
  - name: ble-flood-guard
    image: ghcr.io/espresense/ble-loadgen:1
    pull: true
    depends_on: [ble-flood]
    volumes:
      - flood_state:/flood
    commands:
      - |
        python3 /app/ble_flood.py --check-heartbeat /flood/ble-flood.alive --wait 60 --stale 60 --watch 15 || {
          echo "=== ble-flood.log (from the detached flood container) ==="
          cat /flood/ble-flood.log 2>/dev/null || echo "(no log file — flood container never started, or the shared volume mount failed)"
          exit 1
        }

  - name: test-esp32
    image: espressif/idf:v5.4.4
    pull: true
    privileged: true
    depends_on: []
    volumes:
      - cache_volume:/cache
      - flood_state:/flood
      - /dev/esp32:/dev/esp32
      - /var/lock/woodpecker:/lock
    environment:
      DEVICE: /dev/esp32
      FIRMWARE_ENV: esp32
      GITHUB_TOKEN:
        from_secret: github_token
      WIFI_SSID:
        from_secret: wifi_ssid
      WIFI_PASSWORD:
        from_secret: wifi_password
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: /cache/ccache-idf
    commands:
      - *hil_run

  - name: test-esp32c3
    image: espressif/idf:v5.4.4
    pull: true
    privileged: true
    depends_on: []
    volumes:
      - cache_volume:/cache
      - flood_state:/flood
      - /dev/esp32c3:/dev/esp32c3
      - /var/lock/woodpecker:/lock
    environment:
      DEVICE: /dev/esp32c3
      FIRMWARE_ENV: esp32c3
      GITHUB_TOKEN:
        from_secret: github_token
      WIFI_SSID:
        from_secret: wifi_ssid
      WIFI_PASSWORD:
        from_secret: wifi_password
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: /cache/ccache-idf
    commands:
      - *hil_run

  - name: test-esp32c6
    image: espressif/idf:v5.4.4
    pull: true
    privileged: true
    depends_on: []
    volumes:
      - cache_volume:/cache
      - flood_state:/flood
      - /dev/esp32c6:/dev/esp32c6
      - /var/lock/woodpecker:/lock
    environment:
      DEVICE: /dev/esp32c6
      FIRMWARE_ENV: esp32c6
      GITHUB_TOKEN:
        from_secret: github_token
      WIFI_SSID:
        from_secret: wifi_ssid
      WIFI_PASSWORD:
        from_secret: wifi_password
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: /cache/ccache-idf
    commands:
      - *hil_run

  - name: test-esp32s3
    image: espressif/idf:v5.4.4
    pull: true
    privileged: true
    depends_on: []
    volumes:
      - cache_volume:/cache
      - flood_state:/flood
      - /dev/esp32s3:/dev/esp32s3
      - /var/lock/woodpecker:/lock
    environment:
      DEVICE: /dev/esp32s3
      FIRMWARE_ENV: esp32s3
      GITHUB_TOKEN:
        from_secret: github_token
      WIFI_SSID:
        from_secret: wifi_ssid
      WIFI_PASSWORD:
        from_secret: wifi_password
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: /cache/ccache-idf
    commands:
      - *hil_run
