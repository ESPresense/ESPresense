when:
  - event: pull_request
    repo: ESPresense/ESPresense
  - event: push
    branch: main
  - event: cron
    branch: main

# Pin to the docker/Linux agent with the ESP32 hardware. Without this the scheduler
# can hand these steps (image:, privileged, /dev/esp32 mounts) to a local-backend
# Windows agent, where they fail instantly with no useful log.
labels:
  backend: docker
  platform: linux/amd64

variables:
  # One command block for all four devices. Everything device-specific comes from the
  # step's own DEVICE / FIRMWARE_ENV, including the lock file name, so the soak policy
  # below lives in exactly one place instead of four copies drifting apart.
  - &hil_run |
    . $IDF_PATH/export.sh
    git clone -q --depth 1 https://github.com/ESPresense/firmware-tester /tmp/firmware-tester
    # The four device steps run concurrently and the component manager writes
    # managed_components/ into the project dir, so each step builds from its own copy.
    cp -r . /tmp/src && cd /tmp/src
    # Bare $GITHUB_TOKEN, not the braced form: Woodpecker substitutes braced references in
    # the YAML before the container ever sees it, and secrets are not available at that
    # point. Braces fail quietly here — an emptied token still clones the public lib_deps,
    # just anonymously and against the unauthenticated rate limit. Escape as $${...} when
    # the shell genuinely needs braces, as the duration log line below does.
    git config --global url."https://$GITHUB_TOKEN@github.com/".insteadOf "https://github.com/"
    # No apostrophes below, comments included: one contraction closes this string.
    flock -w 18000 /lock/$FIRMWARE_ENV.lock bash -c '
      set -e

      # Opt up to the full soak with a soak/* branch or [soak] in the message. On a
      # pull_request that message is the PR title, not the head commit subject.
      #
      # Keep wait + build + soak under the 600m repo timeout, or the pipeline is
      # cancelled with no useful log.
      SOAK_SECS=14400
      case "$CI_PIPELINE_EVENT" in
        cron) DURATION_SECS=$SOAK_SECS ;;
        push) DURATION_SECS=3600 ;;
        *)    DURATION_SECS=180 ;;
      esac
      case "$CI_COMMIT_SOURCE_BRANCH" in soak/*) DURATION_SECS=$SOAK_SECS ;; esac
      case "$CI_COMMIT_MESSAGE" in *"[soak]"*) DURATION_SECS=$SOAK_SECS ;; esac
      # $${...} escapes the brace form past Woodpecker so the shell expands it after the
      # assignments above. Braces are needed to keep the "s" out of the variable name.
      echo "HIL $FIRMWARE_ENV: $${DURATION_SECS}s (event=$CI_PIPELINE_EVENT branch=$CI_COMMIT_SOURCE_BRANCH)"

      ./build.sh $FIRMWARE_ENV -p $DEVICE -b 115200 erase-flash flash
      python3 /tmp/firmware-tester/scripts/improv_wifi.py --port $DEVICE --ssid "$WIFI_SSID" --password "$WIFI_PASSWORD"
      # The monitor needs every serial line, the CI log does not: 80 New/Del lines a second
      # for 4h stalled the Woodpecker agent (docker API timeouts, exit 126) on pipeline 1280.
      set -o pipefail
      python3 /tmp/firmware-tester/scripts/hil_monitor.py --port $DEVICE --duration $DURATION_SECS \
        | grep --line-buffered -vE "^[0-9]+ (New|Del) "
    '

steps:
  - name: ble-flood
    image: ghcr.io/espresense/ble-loadgen:1
    pull: true
    detach: true
    privileged: true
    network_mode: host
    depends_on: []

  - name: test-esp32
    image: espressif/idf:v5.4.4
    pull: true
    privileged: true
    depends_on: []
    volumes:
      - cache_volume:/cache
      - /dev/esp32:/dev/esp32
      - /var/lock/woodpecker:/lock
    environment:
      DEVICE: /dev/esp32
      FIRMWARE_ENV: esp32
      GITHUB_TOKEN:
        from_secret: github_token
      WIFI_SSID:
        from_secret: wifi_ssid
      WIFI_PASSWORD:
        from_secret: wifi_password
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: /cache/ccache-idf
    commands:
      - *hil_run

  - name: test-esp32c3
    image: espressif/idf:v5.4.4
    pull: true
    privileged: true
    depends_on: []
    volumes:
      - cache_volume:/cache
      - /dev/esp32c3:/dev/esp32c3
      - /var/lock/woodpecker:/lock
    environment:
      DEVICE: /dev/esp32c3
      FIRMWARE_ENV: esp32c3
      GITHUB_TOKEN:
        from_secret: github_token
      WIFI_SSID:
        from_secret: wifi_ssid
      WIFI_PASSWORD:
        from_secret: wifi_password
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: /cache/ccache-idf
    commands:
      - *hil_run

  - name: test-esp32c6
    image: espressif/idf:v5.4.4
    pull: true
    privileged: true
    depends_on: []
    volumes:
      - cache_volume:/cache
      - /dev/esp32c6:/dev/esp32c6
      - /var/lock/woodpecker:/lock
    environment:
      DEVICE: /dev/esp32c6
      FIRMWARE_ENV: esp32c6
      GITHUB_TOKEN:
        from_secret: github_token
      WIFI_SSID:
        from_secret: wifi_ssid
      WIFI_PASSWORD:
        from_secret: wifi_password
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: /cache/ccache-idf
    commands:
      - *hil_run

  - name: test-esp32s3
    image: espressif/idf:v5.4.4
    pull: true
    privileged: true
    depends_on: []
    volumes:
      - cache_volume:/cache
      - /dev/esp32s3:/dev/esp32s3
      - /var/lock/woodpecker:/lock
    environment:
      DEVICE: /dev/esp32s3
      FIRMWARE_ENV: esp32s3
      GITHUB_TOKEN:
        from_secret: github_token
      WIFI_SSID:
        from_secret: wifi_ssid
      WIFI_PASSWORD:
        from_secret: wifi_password
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: /cache/ccache-idf
    commands:
      - *hil_run
