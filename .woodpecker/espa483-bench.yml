# ESPA-483 one-off bench trial: BLE-advert reception cost at csi_active_pps = 0/20/50 on
# esp32c3-csicap, against the same fixed ble-flood reference hil.yml uses. Scoped to this
# branch only so it never runs on other PRs or on main; delete once the numbers are in hand
# (see tools/espa483_bench_active.py). Locks share hil.yml's /lock/esp32c3.lock and
# /lock/ble-flood.lock names on purpose, so this can't collide with a concurrent hil.yml run
# fighting over the same /dev/esp32c3 or the same BLE dongle.
when:
  - event: push
    branch: feat/csi-espectre-capture
    repo: ESPresense/ESPresense

labels:
  backend: docker
  platform: linux/amd64

steps:
  - name: ble-flood
    image: ghcr.io/espresense/ble-loadgen:2
    pull: true
    privileged: true
    network_mode: host
    depends_on: []
    volumes:
      - /var/lock/woodpecker:/lock
    temp_volumes:
      - flood:/flood
    commands:
      - flock -w 18000 /lock/ble-flood.lock python3 /app/ble_flood.py --index 0 --rate 40 --pool 1024 --until /flood/done --seconds 3000

  - name: ble-flood-stop
    image: ghcr.io/espresense/ble-loadgen:2
    depends_on: [bench-esp32c3]
    when:
      - status: [success, failure]
    temp_volumes:
      - flood:/flood
    commands:
      - touch /flood/done

  - name: bench-esp32c3
    image: espressif/idf:v5.4.4
    pull: true
    privileged: true
    depends_on: []
    volumes:
      - cache_volume:/cache
      - /dev/esp32c3:/dev/esp32c3
      - /var/lock/woodpecker:/lock
    environment:
      DEVICE: /dev/esp32c3
      GITHUB_TOKEN:
        from_secret: github_token
      WIFI_SSID:
        from_secret: wifi_ssid
      WIFI_PASSWORD:
        from_secret: wifi_password
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: /cache/ccache-idf
    commands:
      - |
        . $IDF_PATH/export.sh
        git clone -q --depth 1 https://github.com/ESPresense/firmware-tester /tmp/firmware-tester
        git config --global url."https://$GITHUB_TOKEN@github.com/".insteadOf "https://github.com/"
        python3 -m pip install --quiet pyserial
        cp -r . /tmp/src && cd /tmp/src
        flock -w 18000 /lock/esp32c3.lock bash -c '
          set -e
          ./build.sh esp32c3-csicap -p $DEVICE -b 115200 erase-flash flash
          python3 /tmp/firmware-tester/scripts/improv_wifi.py --port $DEVICE --ssid "$WIFI_SSID" --password "$WIFI_PASSWORD"
          python3 tools/espa483_bench_active.py --port $DEVICE --rates 0 20 50 --duration 300 --out /tmp/bench-active.json
          cat /tmp/bench-active.json
        '
