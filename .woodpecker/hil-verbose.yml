# Manual / on-demand HIL runs for verbose firmware variants.
# This is intentionally NOT run on PR/push/cron due to high log volume.

when:
  - event: manual

# Pin to the docker/Linux agent with the ESP32 hardware (see hil.yml).
labels:
  backend: docker
  platform: linux/amd64

steps:
  - name: test-esp32-verbose
    image: espressif/idf:v5.4.4
    pull: true
    privileged: true
    depends_on: []
    volumes:
      - cache_volume:/cache
      - /dev/esp32:/dev/esp32
      - /var/lock/woodpecker:/lock
    environment:
      DEVICE: /dev/esp32
      FIRMWARE_ENV: esp32-verbose
      GITHUB_TOKEN:
        from_secret: github_token
      WIFI_SSID:
        from_secret: wifi_ssid
      WIFI_PASSWORD:
        from_secret: wifi_password
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: /cache/ccache-idf
    commands:
      - |
        . $IDF_PATH/export.sh
        git clone -q --depth 1 https://github.com/ESPresense/firmware-tester /tmp/firmware-tester
        git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        flock -w 3600 /lock/esp32.lock bash -c '
          set -e
          DURATION_SECS=${MANUAL_DURATION_SECS:-1800}
          ./build.sh $FIRMWARE_ENV -p $DEVICE erase-flash flash
          python3 /tmp/firmware-tester/scripts/improv_wifi.py --port $DEVICE --ssid "$WIFI_SSID" --password "$WIFI_PASSWORD"
          python3 /tmp/firmware-tester/scripts/hil_monitor.py --port $DEVICE --duration $DURATION_SECS
        '

