# Explicit manual benchmark. No house node is addressed from this pipeline.
when:
  - event: manual
    branch: [bench/csi-reference-family-master, bench/csi-reference-controls-resume, bench/csi-reference-external-host]

# Crow accepts manual inputs only when the selected workflow declares them.
# https://crowci.dev/v6-6/usage/pipelines/#declaring-variables
variables:
  REFERENCE_PHASE_START:
    description: First phase index; partial continuations cannot pass the house gate
    options: ['0', '1', '2', '3', '4', '5', '6']
    default: '0'
  REFERENCE_TRAFFIC_SOURCE:
    description: Explicit acquisition control; SDK and100pps cadence remain unchanged
    options: ['ping', 'external']
    default: 'ping'
  REFERENCE_BLE_POOL:
    description: BLE identity pool at the same requested40 rotations/s;64 is a separate workload diagnostic
    options: ['64', '1024']
    default: '1024'
  REFERENCE_COEX_AUDIT:
    description: Compare SDK object code before and after adding its coexistence dependency
    options: ['false', 'true']
    default: 'false'

labels:
  backend: docker
  platform: linux/amd64

steps:
  - name: ble-reference-flood
    image: ghcr.io/espresense/ble-loadgen:2
    pull: true
    privileged: true
    network_mode: host
    environment:
      REFERENCE_BLE_POOL: ${REFERENCE_BLE_POOL:-1024}
    depends_on: []
    volumes:
      - /var/lock/woodpecker:/lock
    temp_volumes:
      - reference-flood:/flood
    commands:
      - flock -w 1800 /lock/ble-flood.lock python3 tools/csi_reference/flood_ready.py --index 0 --rate 40 --pool "$REFERENCE_BLE_POOL" --until /flood/done --seconds 2400

  - name: reference-esp32c3
    image: espressif/idf:v5.5.6
    pull: true
    privileged: true
    depends_on: []
    volumes:
      - cache_volume:/cache
      - /dev/esp32c3:/dev/esp32c3
      - /var/lock/woodpecker:/lock
    temp_volumes:
      - reference-flood:/flood
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
      WIFI_SSID:
        from_secret: wifi_ssid
      WIFI_PASSWORD:
        from_secret: wifi_password
      IDF_CCACHE_ENABLE: '1'
      CCACHE_DIR: /cache/ccache-idf
      REFERENCE_PHASE_START: ${REFERENCE_PHASE_START:-0}
      REFERENCE_TRAFFIC_SOURCE: ${REFERENCE_TRAFFIC_SOURCE:-ping}
      REFERENCE_BLE_POOL: ${REFERENCE_BLE_POOL:-1024}
      REFERENCE_COEX_AUDIT: ${REFERENCE_COEX_AUDIT:-false}
    commands:
      - |
        . $IDF_PATH/export.sh
        cp -r . /tmp/reference-src && cd /tmp/reference-src
        git clone -q --depth 1 https://github.com/ESPresense/firmware-tester /tmp/firmware-tester
        git config --global url."https://$GITHUB_TOKEN@github.com/".insteadOf "https://github.com/"
        export FW_VERSION="$(git rev-parse --short=7 HEAD)"
        export FW_BRANCH="$CI_COMMIT_BRANCH"
        python3 tools/prepare_csi_reference.py
        python3 -m unittest discover -s tools/csi_reference -p test_bench.py -v
        echo "BENCH workload requested_rotations_per_second=40 identity_pool=$REFERENCE_BLE_POOL"
        # Acquire flood before device: ordinary HIL holds its flood while
        # waiting for the device lock. Reversing that order would deadlock.
        python3 -c 'import pathlib,time; end=time.monotonic()+1800; ready=pathlib.Path("/flood/ready"); exec("while not ready.exists() and time.monotonic()<end: time.sleep(1)"); assert ready.exists(), "Controlled BLE flood did not become ready"; print(ready.read_text())'
        flock -w 1800 /lock/esp32c3.lock bash -c '
          set -e
          if [ "$REFERENCE_COEX_AUDIT" = true ]; then
            CSI_REFERENCE_COEX_DEPENDENCY=0 ./build.sh esp32c3-csiref
            python3 tools/csi_reference/audit_coexistence_build.py --build build/esp32c3-csiref --label before_dependency
          fi
          export CSI_REFERENCE_COEX_DEPENDENCY=1
          ./build.sh esp32c3-csiref reconfigure
          ./build.sh esp32c3-csiref
          python3 tools/csi_reference/audit_coexistence_build.py --build build/esp32c3-csiref --label required_dependency --require
          test "$(stat -c%s build/esp32c3-csiref/espresense.bin)" -le 1966080
          ./build.sh esp32c3-csiref -p /dev/esp32c3 -b 115200 erase-flash flash
          python3 /tmp/firmware-tester/scripts/improv_wifi.py --port /dev/esp32c3 --ssid "$WIFI_SSID" --password "$WIFI_PASSWORD"
          python3 tools/csi_reference/bench.py --port /dev/esp32c3 --seconds 120 --expected-version "$FW_VERSION" --flood-ready /flood/ready --no-scan-control --safety-checks --phase-start "$REFERENCE_PHASE_START" --traffic-source "$REFERENCE_TRAFFIC_SOURCE" --out /tmp/reference-pilot.json
        '

  - name: ble-reference-flood-stop
    image: alpine:3.22
    depends_on: [reference-esp32c3]
    when:
      - status: [success, failure]
    temp_volumes:
      - reference-flood:/flood
    commands:
      - touch /flood/done
